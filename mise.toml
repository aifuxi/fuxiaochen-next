[tools]
node = "24.21.0"
pnpm = "12.3.4"

[tasks.install]
description = "按锁文件安装项目依赖"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "在后台启动 Astro 开发服务"
run = "pnpm run dev --background"

[tasks."dev:status"]
description = "查询 Astro 后台开发服务"
run = "pnpm run dev status"

[tasks."dev:logs"]
description = "查看 Astro 后台开发服务日志"
run = "pnpm run dev logs"

[tasks."dev:stop"]
description = "停止 Astro 后台开发服务"
run = "pnpm run dev stop"

[tasks.build]
description = "构建 Astro 站点"
run = "pnpm run build"
