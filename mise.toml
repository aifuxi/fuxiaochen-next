[tools]
node = "24.21.0"
pnpm = "12.3.4"

[tasks.install]
description = "按锁文件安装依赖并启用 Git 钩子"
run = "pnpm install --frozen-lockfile && pnpm run prepare"

[tasks.dev]
description = "在后台启动 Astro 开发服务"
run = "pnpm run dev --background"

[tasks."dev:status"]
description = "查询 Astro 后台开发服务"
run = "pnpm run dev status"

[tasks."dev:logs"]
description = "查看 Astro 后台开发服务日志"
run = "pnpm run dev logs"

[tasks."dev:stop"]
description = "停止 Astro 后台开发服务"
run = "pnpm run dev stop"

[tasks.build]
description = "构建 Astro 站点"
run = "pnpm run build"

[tasks.lint]
description = "检查项目代码"
run = "pnpm run lint"

[tasks."lint:fix"]
description = "自动修复可修复的 ESLint 问题"
run = "pnpm run lint:fix"

[tasks.format]
description = "格式化项目文件"
run = "pnpm run format"

[tasks."format:check"]
description = "检查项目文件格式"
run = "pnpm run format:check"

[tasks.check]
description = "检查代码和格式"
run = "pnpm run check"

[tasks."test:unit"]
description = "运行 Vitest 单元测试"
run = "pnpm exec vitest run"

[tasks."test:e2e"]
description = "构建站点并运行 Playwright 发布验收"
depends = ["build"]
run = "PLAYWRIGHT_BASE_URL= pnpm exec playwright test"

[tasks."test:published"]
description = "运行已部署站点的 Playwright 验收"
run = 'test -n "${PLAYWRIGHT_BASE_URL:-}" && pnpm exec playwright test'
