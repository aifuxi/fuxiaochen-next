name: 发布静态站点

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-static-site
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://fuxiaochen.com
    steps:
      - name: 检出发布脚本和线上验收测试
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 下载已通过测试的产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuxiaochen-next-dist
          path: dist/

      - name: 安装 mise 工具链
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: 安装线上验收依赖
        run: |
          mise run install
          mise exec -- pnpm exec playwright install --with-deps chromium

      - name: 通过 SSH 发布并验证线上站点
        run: bash scripts/deploy-site.sh dist
        env:
          DEPLOY_SITE_URL: https://fuxiaochen.com
          DEPLOY_RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_ROOT: /data/fc-apps/fuxiaochen-next
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
